name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint fontforge python3-fontforge

      - name: Build fonts
        run: ./build

      - name: Patch nerd font glyphs
        run: ./patch

      - name: Package
        run: |
          mkdir -p release
          zip -qj release/IosevkaMono.zip dist/IosevkaMono-*.ttf
          zip -qj release/IosevkaSans.zip dist/IosevkaSans-*.ttf
          zip -qj release/IosevkaMonoNerdFont.zip nerd/IosevkaMono*.ttf
          zip -qj release/IosevkaSansNerdFont.zip nerd/IosevkaSans*.ttf
          (cd web && zip -qr ../release/IosevkaMonoWebFont.zip IosevkaMono && zip -qr ../release/IosevkaSansWebFont.zip IosevkaSans)

      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: release/*.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          generate_release_notes: true
